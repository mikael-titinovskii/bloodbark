# The English source of `scope.banner` and `emergency.notice` lives in AGENTS.md and is the
# authoritative wording; this is its Russian rendering. "Matching service" is rendered as
# "сервис установления контактов" on purpose: the site connects owners, it never asserts that one
# dog is suitable for another.
#
# `locale.name.*` is built at render time (`'locale.name.' ~ locale` in templates/base.html.twig),
# so `debug:translation` reports those keys as unused. They are not — keep them when adding a
# language.
scope.banner: >-
    Мы — информационный сервис и сервис установления контактов. Мы не предоставляем ветеринарные
    консультации, диагностику, определения совместимости или услуги по переливанию крови. Все
    решения о совместимости и переливания должны принимать лицензированные ветеринарные врачи.
emergency.notice: >-
    Мы не служба экстренной помощи. При острой ситуации немедленно обратитесь к ветеринарному врачу.
locale.switcher: Язык
nav.skip: Перейти к содержимому
locale.name.ro: Română
locale.name.ru: Русский
error.404.title: Страница не найдена
error.404.text: >-
    Запрошенная страница не существует или была перемещена. Проверьте адрес или вернитесь на
    главную страницу.
error.generic.title: Не удалось выполнить запрос
error.generic.text: Что-то пошло не так. Попробуйте ещё раз через несколько минут.
error.429.title: Слишком много запросов
error.429.text: >-
    С этого подключения отправлено слишком много запросов. Подождите немного и попробуйте снова.
error.back_home: Вернуться на главную страницу

# --- Аккаунт ------------------------------------------------------------------------------
# Labels are shared between the form types (which pass message keys), the account page and the
# header, so a wording change happens once.
register.title: Создать аккаунт
register.intro: >-
    Аккаунт позволяет публиковать объявления о своей собаке и получать сообщения от других
    владельцев. Контактные данные не показываются в результатах поиска.
register.email: Адрес электронной почты
register.password.note: Пароль не выбирают — мы генерируем его и отправляем вам по почте.
register.contact_name: Имя для связи
register.contact_name.help: Как к вам обращаться другим пользователям.
register.contact_type: Способ связи
register.contact_type.placeholder: Выберите способ связи
register.contact_window: Удобное время
register.contact_window.placeholder: Выберите время
register.consent: >-
    Я прочитал(а) политику конфиденциальности и согласен(на) на обработку моих персональных
    данных (версия %version%).
register.adult: Подтверждаю, что мне исполнилось 18 лет.
register.submit: Создать аккаунт
register.have_account: Уже есть аккаунт?

register.sent.title: Проверьте почту
register.sent.text: Мы отправили пароль на %email%. Его можно сразу использовать для входа.
register.sent.hint: Если письмо не пришло за несколько минут, загляните в папку «Спам».

# Chrome shared by every message we send; the per-flow keys live with their own flow below.
email.greeting: Здравствуйте,
