# --- Cookie и статистика ----------------------------------------------------------------------
consent.modal.title: Cookie и статистика использования
consent.modal.description: >-
    Мы используем необходимые cookie для работы сайта. С вашего согласия мы также собираем
    статистику посещённых страниц и действий. Отказ не ограничивает функции сайта.
consent.accept_analytics: Разрешить статистику
consent.necessary_only: Только необходимые
consent.customize: Настроить
consent.preferences.title: Настройки cookie
consent.save: Сохранить настройки
consent.close: Закрыть настройки
consent.preferences.intro.title: Ваш выбор
consent.preferences.intro.description: >-
    Вы можете изменить выбор в любой момент в нижней части страницы. Отключение статистики
    прекращает сбор и удаляет события, связанные с этим браузером.
consent.necessary.title: Строго необходимые cookie
consent.necessary.description: >-
    Они нужны для входа, безопасности и сохранения ваших настроек cookie. Их нельзя отключить.
consent.analytics.title: Статистика использования
consent.analytics.description: >-
    Она помогает понять, какие функции используются. Мы храним действие, дату, язык и страницу
    со случайным идентификатором не более 182 дней. Медицинские и контактные данные не собираются.
consent.manage: Настройки cookie

