# The English source of `scope.banner` and `emergency.notice` lives in AGENTS.md and is the
# authoritative wording; this is its Russian rendering. "Matching service" is rendered as
# "сервис установления контактов" on purpose: the site connects owners, it never asserts that one
# dog is suitable for another.
#
# `locale.name.*` is built at render time (`'locale.name.' ~ locale` in templates/base.html.twig),
# so `debug:translation` reports those keys as unused. They are not — keep them when adding a
# language.
scope.banner: >-
    Мы — информационный сервис и сервис установления контактов. Мы не предоставляем ветеринарные
    консультации, диагностику, определения совместимости или услуги по переливанию крови. Все
    решения о совместимости и переливания должны принимать лицензированные ветеринарные врачи.
emergency.notice: >-
    Мы не служба экстренной помощи. При острой ситуации немедленно обратитесь к ветеринарному врачу.
locale.switcher: Язык
locale.name.ro: Română
locale.name.ru: Русский
error.404.title: Страница не найдена
error.404.text: >-
    Запрошенная страница не существует или была перемещена. Проверьте адрес или вернитесь на
    главную страницу.
error.generic.title: Не удалось выполнить запрос
error.generic.text: Что-то пошло не так. Попробуйте ещё раз через несколько минут.
error.back_home: Вернуться на главную страницу
