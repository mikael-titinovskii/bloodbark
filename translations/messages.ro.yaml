# Labels are shared between the form types (which pass message keys), the account page and the
# header, so a wording change happens once.
register.title: Creează un cont
register.intro: >-
    Contul îți permite să publici anunțuri despre câinele tău și să fii contactat de alți
    proprietari. Datele tale de contact nu apar în rezultatele căutării.
register.email: Adresă de e-mail
register.password.note: Parola nu se alege, o generăm noi și ți-o trimitem pe e-mail.
register.contact_name: Nume de contact
register.contact_name.help: Cum vrei să ți se adreseze ceilalți utilizatori.
register.contact_type: Tip de contact
register.contact_type.placeholder: Alege tipul de contact
register.contact_window: Interval orar preferat
register.contact_window.placeholder: Alege intervalul
