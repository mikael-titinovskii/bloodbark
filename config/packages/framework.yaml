# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # Mail limits stop the forms becoming a relay; higher analytics limits bound public event
    # ingestion without blocking ordinary browsing. All are keyed by client IP in RequestThrottle.
    rate_limiter:
        registration:
            policy: 'sliding_window'
            limit: 5
            interval: '1 hour'
        password_reset:
            policy: 'sliding_window'
            limit: 5
            interval: '1 hour'
        email_confirmation:
            policy: 'sliding_window'
            limit: 5
            interval: '1 hour'
        analytics_consent:
            policy: 'sliding_window'
            limit: 60
            interval: '1 hour'
        analytics_event:
            policy: 'sliding_window'
            limit: 120
            interval: '1 minute'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
