name: bloodbark

services:
  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    depends_on:
      - php
    volumes:
      - './public:/home/docker/src/public:ro'
      - './docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'
      - './docker/nginx/certs/selfsigned.crt:/etc/nginx/certs/selfsigned.crt:ro'
      - './docker/nginx/certs/selfsigned.key:/etc/nginx/certs/selfsigned.key:ro'
    ports:
      - '8000:443'

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    # php-fpm as the host user, so var/ and vendor/ stay writable outside the container.
    user: '${UID:-1000}:${GID:-1000}'
    depends_on:
      database:
        condition: service_healthy
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer/cache
      COMPOSER_HOME: /tmp/composer
      # The container user has no passwd entry, so HOME is unwritable by default; Chromium
      # refuses to start without one. Nothing else in the stack needs it.
      HOME: /tmp
      # Where the Codeception suites (`make ee`) point their browser and their HTTP client.
      # `nginx` is this network's front door; override from the host with E2E_BASE_URL.
      E2E_BASE_URL: ${E2E_BASE_URL:-https://nginx}
      XDEBUG_MODE: develop,debug
      XDEBUG_CONFIG: client_host=host.docker.internal client_port=9002
      PHP_IDE_CONFIG: serverName=bloodbark
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - './:/home/docker/src'

  node:
    image: node:24-alpine
    # Not part of the site's runtime: `up` leaves it alone, and `docker compose run --rm node …`
    # (which activates the profile) is the only way it is used.
    profiles: ['tools']
    # Same reason as php: run as the host user, so node_modules and the build output in public/ stay
    # editable outside the container.
    user: '${UID:-1000}:${GID:-1000}'
    working_dir: /home/docker/src
    environment:
      # The container user has no passwd entry, so npm needs HOME spelled out.
      HOME: /tmp
      # Inside the project (and git-ignored, with the rest of var/) so a one-off container does not
      # re-download every package on each run.
      npm_config_cache: /home/docker/src/var/npm-cache
    volumes:
      - './:/home/docker/src'

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bloodbark
      POSTGRES_USER: bloodbark
      POSTGRES_PASSWORD: bloodbark
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d bloodbark -U bloodbark']
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      # PostgreSQL 18 keeps PGDATA under /var/lib/postgresql/<major>/docker, so
      # the volume is mounted one level above the data directory.
      - 'database_data:/var/lib/postgresql'
###< doctrine/doctrine-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
